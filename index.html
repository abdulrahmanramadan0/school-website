<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرسة الأصدقاء العلمية الخاصة | Friends Private Scientific School</title>
<meta name="description" content="مدرسة الأصدقاء العلمية الخاصة — تربية، علم، أخلاق. مدرسة خاصة حديثة في عفرين تجمع بين التميز الأكاديمي والقيم التربوية للعام الدراسي 2026/2027.">
<link rel="icon" id="faviconLink" type="image/png" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#263F63;
    --navy-deep:#151F33;
    --navy-mid:#334E78;
    --gold:#F5A900;
    --gold-deep:#C98700;
    --gold-pale:#FCE4B0;
    --ink:#22293A;
    --ink-soft:#5B6478;
    --bg:#F5F6F8;
    --white:#FFFFFF;
    --line:#E3E6EC;
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:26px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Readex Pro', sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-weight:400;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  @media (max-width:640px){ .wrap{padding:0 18px;} }

  /* focus visibility */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:3px solid var(--gold); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:0; z-index:60;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-row{ display:flex; align-items:center; justify-content:space-between; height:82px; gap:20px;}
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:52px; height:52px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    position:relative; flex-shrink:0;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .brand-text{display:flex; flex-direction:column; line-height:1.3;}
  .brand-text .ar{font-weight:700; font-size:16.5px; color:var(--navy-deep);}
  .brand-text .en{font-weight:300; font-size:11px; color:var(--ink-soft); letter-spacing:.02em;}
  nav.main-nav{ display:flex; align-items:center; gap:6px; }
  nav.main-nav a{
    padding:10px 14px; border-radius:99px; font-weight:500; font-size:15px; color:var(--ink);
    transition:background .2s ease, color .2s ease;
    white-space:nowrap;
  }
  nav.main-nav a:hover{ background:var(--bg); color:var(--navy-deep); }
  nav.main-nav a.active{ background:var(--navy); color:#fff; }
  .cta-btn{
    background:var(--gold); color:var(--navy-deep); font-weight:700; font-size:15px;
    padding:12px 24px; border-radius:99px; border:none; white-space:nowrap;
    box-shadow:0 8px 18px rgba(245,169,0,.32);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .cta-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 22px rgba(245,169,0,.4); }
  .ghost-btn{
    background:transparent; color:var(--navy-deep); font-weight:600; font-size:15px;
    padding:11px 22px; border-radius:99px; border:1.5px solid var(--navy);
    transition:background .2s ease, color .2s ease;
  }
  .ghost-btn:hover{ background:var(--navy); color:#fff; }
  .menu-toggle{ display:none; background:none; border:none; padding:8px; }
  @media (max-width:980px){
    nav.main-nav, header .cta-desktop{ display:none; }
    .menu-toggle{ display:flex; }
  }
  #mobileMenu{
    display:none; position:fixed; inset:82px 0 0 0; background:var(--white); z-index:59;
    padding:26px 24px; overflow-y:auto;
  }
  #mobileMenu.open{ display:block; }
  #mobileMenu a{
    display:block; padding:16px 6px; font-size:18px; font-weight:600; border-bottom:1px solid var(--line);
  }
  #mobileMenu .cta-btn{ display:block; text-align:center; margin-top:22px; }

  /* ---------- Buttons generic ---------- */
  .btn-primary{
    display:inline-flex; align-items:center; gap:8px; background:var(--navy); color:#fff;
    font-weight:700; font-size:15.5px; padding:14px 28px; border-radius:99px; border:none;
    transition:transform .2s ease, background .2s ease;
  }
  .btn-primary:hover{ background:var(--navy-deep); transform:translateY(-2px); }
  .btn-gold{
    display:inline-flex; align-items:center; gap:8px; background:var(--gold); color:var(--navy-deep);
    font-weight:700; font-size:15.5px; padding:14px 28px; border-radius:99px; border:none;
    box-shadow:0 10px 20px rgba(245,169,0,.3);
    transition:transform .2s ease;
  }
  .btn-gold:hover{ transform:translateY(-2px); }
  .btn-outline{
    display:inline-flex; align-items:center; gap:8px; background:transparent; color:#fff;
    font-weight:700; font-size:15.5px; padding:13px 27px; border-radius:99px; border:1.5px solid rgba(255,255,255,.55);
    transition:background .2s ease;
  }
  .btn-outline:hover{ background:rgba(255,255,255,.12); }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    background:linear-gradient(165deg, var(--navy-deep) 0%, var(--navy) 62%, var(--navy-mid) 100%);
    color:#fff; padding:76px 0 110px;
  }
  .hero-pattern{ position:absolute; inset:0; opacity:.14; pointer-events:none; }
  .hero-grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:50px; align-items:center; position:relative; z-index:2; }
  @media (max-width:940px){ .hero-grid{ grid-template-columns:1fr; } }
  .eyebrow-seal{
    display:inline-flex; align-items:center; gap:10px; background:rgba(245,169,0,.14);
    border:1px solid rgba(245,169,0,.4); color:var(--gold);
    padding:8px 18px; border-radius:99px; font-weight:600; font-size:14px; margin-bottom:26px;
  }
  .hero h1.school-name{ font-size:clamp(30px,4.4vw,46px); font-weight:800; margin:0 0 10px; letter-spacing:-.01em;}
  .hero .slogan{ color:var(--gold); font-weight:600; font-size:18px; margin-bottom:26px; letter-spacing:.04em;}
  .hero h2.headline{ font-size:clamp(26px,3.6vw,40px); font-weight:300; line-height:1.5; margin:0 0 34px; max-width:640px;}
  .hero h2.headline strong{ font-weight:700; }
  .hero .btn-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .hero-emblem{
    position:relative; aspect-ratio:1/1; border-radius:32px;
    background:radial-gradient(circle at 30% 25%, rgba(245,169,0,.22), transparent 55%), rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center;
  }
  .hero-emblem .ring{ position:absolute; border:1.5px solid rgba(245,169,0,.35); border-radius:50%; }
  .hero-emblem svg{ width:46%; height:46%; }
  .hero-stats{ display:flex; gap:0; margin-top:56px; border-top:1px solid rgba(255,255,255,.16); padding-top:28px; flex-wrap:wrap; }
  .hero-stats .stat{ padding-inline-end:40px; margin-inline-end:40px; border-inline-end:1px solid rgba(255,255,255,.16); }
  .hero-stats .stat:last-child{ border-inline-end:none; }
  .hero-stats .num{ font-size:30px; font-weight:800; color:var(--gold); }
  .hero-stats .lbl{ font-size:13.5px; color:rgba(255,255,255,.75); font-weight:400; }

  /* ---------- Section shell ---------- */
  section{ padding:88px 0; }
  @media (max-width:640px){ section{ padding:60px 0; } }
  .section-head{ max-width:680px; margin:0 0 46px; }
  .section-head.center{ margin-inline:auto; text-align:center; }
  .kicker{ color:var(--gold-deep); font-weight:700; font-size:14.5px; margin:0 0 10px; }
  .section-head h2{ font-size:clamp(24px,3vw,34px); font-weight:800; margin:0 0 14px; color:var(--navy-deep); }
  .section-head p{ color:var(--ink-soft); font-size:16.5px; margin:0; }
  .section-alt{ background:var(--white); }

  /* ---------- Cards ---------- */
  .grid{ display:grid; gap:26px; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width:900px){ .grid-3{ grid-template-columns:1fr 1fr; } }
  @media (max-width:640px){ .grid-3, .grid-2{ grid-template-columns:1fr; } }

  .feature-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);
    padding:30px 26px; transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .feature-card:hover{ transform:translateY(-4px); box-shadow:0 18px 32px rgba(21,31,51,.08); border-color:transparent; }
  .feature-icon{
    width:52px; height:52px; border-radius:14px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px; color:var(--navy);
    border:1px solid var(--line);
  }
  .feature-card h3{ font-size:18px; font-weight:700; margin:0 0 8px; color:var(--navy-deep); }
  .feature-card p{ font-size:14.5px; color:var(--ink-soft); margin:0; }

  .dept-card{
    background:#fff; border-radius:var(--radius-lg); overflow:hidden; border:1px solid var(--line);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .dept-card:hover{ transform:translateY(-4px); box-shadow:0 20px 36px rgba(21,31,51,.1); }
  .dept-cover{ height:170px; position:relative; display:flex; align-items:flex-end; padding:18px; color:#fff; }
  .dept-cover .stage-badge{
    position:absolute; top:16px; inset-inline-start:16px; background:rgba(255,255,255,.18);
    backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.35); color:#fff;
    font-size:13px; font-weight:700; padding:5px 14px; border-radius:99px;
  }
  .dept-body{ padding:22px 24px 26px; }
  .dept-body h3{ font-size:19px; font-weight:700; margin:0 0 8px; color:var(--navy-deep); }
  .dept-body p{ font-size:14.5px; color:var(--ink-soft); margin:0 0 16px; }
  .link-arrow{ color:var(--navy); font-weight:700; font-size:14.5px; display:inline-flex; align-items:center; gap:6px; }
  .link-arrow svg{ width:16px; height:16px; }

  .news-card{
    background:#fff; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--line);
    transition:transform .25s ease, box-shadow .25s ease; display:flex; flex-direction:column;
  }
  .news-card:hover{ transform:translateY(-4px); box-shadow:0 18px 32px rgba(21,31,51,.09); }
  .news-thumb{ height:170px; background:linear-gradient(135deg, var(--navy), var(--navy-mid)); position:relative; }
  .news-thumb .date-chip{
    position:absolute; bottom:12px; inset-inline-start:12px; background:var(--gold); color:var(--navy-deep);
    font-size:12.5px; font-weight:700; padding:5px 12px; border-radius:99px;
  }
  .news-body{ padding:20px 22px 24px; flex:1; display:flex; flex-direction:column; }
  .news-body h3{ font-size:17px; font-weight:700; margin:0 0 8px; color:var(--navy-deep); }
  .news-body p{ font-size:14px; color:var(--ink-soft); margin:0 0 16px; flex:1; }

  .event-row{
    display:flex; gap:20px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);
    padding:18px; align-items:center;
  }
  @media (max-width:560px){ .event-row{ flex-direction:column; align-items:stretch; } }
  .event-date-box{
    flex-shrink:0; width:76px; height:76px; border-radius:14px; background:var(--navy);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .event-date-box .d{ font-size:24px; font-weight:800; line-height:1; }
  .event-date-box .m{ font-size:12px; font-weight:500; }
  .event-info h3{ margin:0 0 6px; font-size:16.5px; font-weight:700; color:var(--navy-deep); }
  .event-info p{ margin:0; font-size:13.5px; color:var(--ink-soft); }

  .value-card{
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-md); padding:26px;
    position:relative; text-align:center;
  }
  .value-card::before{
    content:''; position:absolute; top:14px; inset-inline-start:14px; inset-inline-end:14px; bottom:14px;
    border:1px solid var(--gold-pale); border-radius:12px; pointer-events:none;
  }
  .value-card .letter{
    width:56px; height:56px; margin:0 auto 14px; border-radius:50%; background:var(--navy-deep); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800;
  }
  .value-card h3{ font-size:16.5px; font-weight:700; margin:0 0 6px; color:var(--navy-deep); }
  .value-card p{ font-size:13.5px; color:var(--ink-soft); margin:0; }

  /* ---------- CTA band ---------- */
  .cta-band{
    background:linear-gradient(135deg, var(--navy-deep), var(--navy));
    border-radius:var(--radius-lg); padding:56px 44px; color:#fff; text-align:center; position:relative; overflow:hidden;
  }
  .cta-band h2{ font-size:clamp(22px,3vw,30px); font-weight:800; margin:0 0 14px; }
  .cta-band p{ color:rgba(255,255,255,.8); max-width:560px; margin:0 auto 30px; font-size:15.5px; }
  .cta-band .btn-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

  /* ---------- Page hero (inner pages) ---------- */
  .page-hero{
    background:linear-gradient(165deg, var(--navy-deep), var(--navy));
    color:#fff; padding:64px 0 74px; position:relative; overflow:hidden;
  }
  .page-hero h1{ font-size:clamp(26px,3.6vw,38px); font-weight:800; margin:0 0 12px; }
  .page-hero p{ color:rgba(255,255,255,.82); font-size:16px; max-width:600px; margin:0; }
  .crumbs{ font-size:13.5px; color:rgba(255,255,255,.6); margin-bottom:16px; display:flex; gap:8px; align-items:center;}

  /* ---------- Alternating dept sections ---------- */
  .alt-row{ display:grid; grid-template-columns:1fr 1fr; gap:54px; align-items:center; margin-bottom:70px; }
  .alt-row:last-child{ margin-bottom:0; }
  .alt-row.reverse .alt-media{ order:2; }
  @media (max-width:860px){ .alt-row, .alt-row.reverse .alt-media{ grid-template-columns:1fr; order:0; } .alt-row{ grid-template-columns:1fr; } }
  .alt-media{
    aspect-ratio:4/3; border-radius:var(--radius-lg); background:linear-gradient(150deg, var(--navy), var(--navy-mid));
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .alt-media svg{ width:34%; height:34%; opacity:.9; }
  .alt-text .stage-num{ color:var(--gold-deep); font-weight:800; font-size:14.5px; margin-bottom:10px; }
  .alt-text h3{ font-size:24px; font-weight:800; color:var(--navy-deep); margin:0 0 14px; }
  .alt-text p{ color:var(--ink-soft); margin:0 0 18px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip{ background:var(--bg); border:1px solid var(--line); padding:7px 14px; border-radius:99px; font-size:13px; font-weight:600; color:var(--navy-deep); }
  .obj-list{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px; }
  .obj-list li{ display:flex; gap:10px; align-items:flex-start; font-size:14.5px; color:var(--ink); }
  .obj-list svg{ width:18px; height:18px; color:var(--gold-deep); flex-shrink:0; margin-top:2px; }

  /* ---------- Registration page ---------- */
  .doc-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  @media (max-width:700px){ .doc-grid{ grid-template-columns:1fr; } }
  .doc-item{ display:flex; gap:14px; background:#fff; border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px 18px; align-items:flex-start; }
  .doc-item .num{ width:32px; height:32px; border-radius:9px; background:var(--navy-deep); color:var(--gold); font-weight:800; font-size:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .doc-item p{ margin:0; font-size:14.5px; font-weight:500; }

  .discount-card{ background:#fff; border-radius:var(--radius-md); padding:26px; border-top:4px solid var(--gold); border:1px solid var(--line); border-top:4px solid var(--gold); }
  .discount-card .pct{ font-size:34px; font-weight:800; color:var(--navy-deep); }
  .discount-card .pct span{ font-size:16px; font-weight:500; color:var(--ink-soft); }
  .discount-card p{ color:var(--ink-soft); font-size:14.5px; margin:10px 0 0; }

  .calc-panel{ background:linear-gradient(165deg, var(--navy-deep), var(--navy)); border-radius:var(--radius-lg); padding:44px; color:#fff; }
  @media (max-width:640px){ .calc-panel{ padding:28px 22px; } }
  .calc-panel .section-head h2, .calc-panel .section-head p{ color:#fff; }
  .calc-panel .section-head p{ color:rgba(255,255,255,.78); }
  .dob-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:20px; }
  @media (max-width:560px){ .dob-row{ grid-template-columns:1fr; } }
  .dob-row select{
    width:100%; padding:14px 16px; border-radius:12px; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08); color:#fff; font-size:15px; font-weight:500; appearance:none;
  }
  .dob-row select option{ color:#111; }
  .dob-row label{ display:block; font-size:13px; color:rgba(255,255,255,.7); margin-bottom:7px; font-weight:500; }
  .calc-result{
    margin-top:24px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    border-radius:16px; padding:24px; display:none;
  }
  .calc-result.show{ display:block; }
  .calc-result .grade-name{ font-size:26px; font-weight:800; color:var(--gold); }
  .calc-result .dob-echo{ font-size:13.5px; color:rgba(255,255,255,.75); margin-top:4px; }
  .calc-result .disclaimer{ font-size:12.5px; color:rgba(255,255,255,.55); margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.15); }
  .sample-flag{
    background:rgba(245,169,0,.16); border:1px dashed rgba(245,169,0,.6); color:var(--gold);
    font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:10px; margin-top:16px; display:inline-flex; gap:6px; align-items:center;
  }

  .age-table{ width:100%; border-collapse:collapse; background:#fff; border-radius:var(--radius-md); overflow:hidden; }
  .age-table th, .age-table td{ padding:14px 18px; text-align:right; font-size:14.5px; }
  .age-table th{ background:var(--navy-deep); color:#fff; font-weight:700; }
  .age-table tr:nth-child(even){ background:var(--bg); }
  .age-table-wrap{ border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; overflow-x:auto; }
  .age-cards{ display:none; }
  @media (max-width:700px){
    .age-table-wrap{ display:none; }
    .age-cards{ display:flex; flex-direction:column; gap:10px; }
    .age-cards .ac-item{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
    .age-cards .ac-item .g{ font-weight:700; color:var(--navy-deep); margin-bottom:4px; }
    .age-cards .ac-item .r{ font-size:13.5px; color:var(--ink-soft); }
  }
  .special-note{
    display:flex; gap:14px; background:#FFF7E6; border:1px solid var(--gold-pale); border-radius:var(--radius-md);
    padding:18px 20px; align-items:flex-start;
  }
  .special-note svg{ color:var(--gold-deep); flex-shrink:0; width:22px; height:22px; margin-top:2px; }
  .special-note p{ margin:0; font-size:14.5px; color:var(--ink); }

  /* ---------- Contact page ---------- */
  .contact-grid{ display:grid; grid-template-columns:.9fr 1.1fr; gap:40px; align-items:start; }
  @media (max-width:900px){ .contact-grid{ grid-template-columns:1fr; } }
  .contact-info-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:26px; display:flex; gap:16px; align-items:flex-start; margin-bottom:16px; }
  .contact-info-card .ic{ width:46px; height:46px; border-radius:12px; background:var(--bg); display:flex; align-items:center; justify-content:center; color:var(--navy); flex-shrink:0; }
  .contact-info-card h4{ margin:0 0 6px; font-size:15.5px; font-weight:700; color:var(--navy-deep); }
  .contact-info-card p, .contact-info-card a{ margin:0; font-size:14.5px; color:var(--ink-soft); }
  .contact-info-card a:hover{ color:var(--navy); text-decoration:underline; }
  .map-frame{ width:100%; height:280px; border:0; border-radius:var(--radius-md); margin-top:6px; }
  .form-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:34px; }
  @media (max-width:640px){ .form-card{ padding:22px; } }
  .form-field{ margin-bottom:18px; }
  .form-field label{ display:block; font-size:14px; font-weight:600; margin-bottom:7px; color:var(--navy-deep); }
  .form-field input, .form-field textarea{
    width:100%; padding:13px 16px; border-radius:12px; border:1.5px solid var(--line); font-size:14.5px; background:var(--bg);
    transition:border-color .2s ease;
  }
  .form-field input:focus, .form-field textarea:focus{ border-color:var(--navy); outline:none; background:#fff; }
  .form-field .err{ color:#C0392B; font-size:12.5px; margin-top:6px; display:none; }
  .form-field.invalid input, .form-field.invalid textarea{ border-color:#C0392B; }
  .form-field.invalid .err{ display:block; }
  .form-row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:520px){ .form-row2{ grid-template-columns:1fr; } }
  .success-box{
    display:none; background:#EAF7EE; border:1px solid #BEE5C9; color:#1F7A3D; padding:18px 20px;
    border-radius:12px; font-size:14.5px; font-weight:600; margin-bottom:18px; align-items:center; gap:10px;
  }
  .success-box.show{ display:flex; }
  .social-row{ display:flex; gap:10px; margin-top:6px; }
  .social-btn{ width:44px; height:44px; border-radius:12px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; transition:background .2s ease; }
  .social-btn:hover{ background:var(--navy-deep); }

  /* ---------- Footer ---------- */
  footer.site{ background:var(--navy-deep); color:rgba(255,255,255,.82); padding:60px 0 26px; }
  .footer-grid{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1.1fr; gap:36px; margin-bottom:40px; }
  @media (max-width:860px){ .footer-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:560px){ .footer-grid{ grid-template-columns:1fr; } }
  .footer-grid h4{ color:#fff; font-size:15px; font-weight:700; margin:0 0 16px; }
  .footer-brand{ display:flex; gap:12px; align-items:center; margin-bottom:14px; }
  .footer-grid p, .footer-grid a{ font-size:14px; color:rgba(255,255,255,.68); margin:0 0 10px; display:block; }
  .footer-grid a:hover{ color:var(--gold); }
  .footer-bottom{ border-top:1px solid rgba(255,255,255,.14); padding-top:22px; text-align:center; font-size:13px; color:rgba(255,255,255,.55); }

  /* ---------- Admin ---------- */
  .admin-shell{ display:grid; grid-template-columns:230px 1fr; min-height:calc(100vh - 82px); }
  @media (max-width:800px){ .admin-shell{ grid-template-columns:1fr; } }
  .admin-side{ background:var(--navy-deep); color:#fff; padding:26px 16px; }
  .admin-side button{
    width:100%; text-align:right; background:none; border:none; color:rgba(255,255,255,.75);
    padding:12px 14px; border-radius:10px; font-size:14.5px; font-weight:500; margin-bottom:4px;
    display:flex; align-items:center; gap:10px; justify-content:flex-end;
  }
  .admin-side button.active{ background:rgba(245,169,0,.16); color:var(--gold); font-weight:700; }
  .admin-side button:hover{ background:rgba(255,255,255,.06); }
  .admin-main{ padding:34px; background:var(--bg); }
  @media (max-width:640px){ .admin-main{ padding:20px; } }
  .admin-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:20px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:26px; }
  @media (max-width:640px){ .stat-grid{ grid-template-columns:1fr; } }
  .stat-box{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; }
  .stat-box .n{ font-size:30px; font-weight:800; color:var(--navy-deep); }
  .stat-box .l{ font-size:13.5px; color:var(--ink-soft); }
  .admin-table{ width:100%; border-collapse:collapse; }
  .admin-table th, .admin-table td{ text-align:right; padding:12px 10px; border-bottom:1px solid var(--line); font-size:14px; }
  .admin-table th{ color:var(--ink-soft); font-weight:600; font-size:13px; }
  .row-actions{ display:flex; gap:8px; }
  .icon-btn{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .icon-btn:hover{ background:var(--bg); color:var(--navy); }
  .icon-btn.danger:hover{ color:#C0392B; border-color:#f2c3bc; }
  .badge{ font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; }
  .badge.unread{ background:#FDEBD0; color:#B9770E; }
  .badge.read{ background:#EAECEE; color:#7B8794; }
  .login-box{ max-width:400px; margin:90px auto; background:#fff; border:1px solid var(--line); border-radius:18px; padding:36px; text-align:center; }
  .login-box h2{ margin:0 0 6px; color:var(--navy-deep); }
  .login-box p{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; }
  .demo-note{ background:#FFF7E6; border:1px solid var(--gold-pale); color:#8a6100; font-size:12.5px; padding:10px 14px; border-radius:10px; margin-top:16px; text-align:right; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(21,31,51,.55); z-index:100; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.show{ display:flex; }
  .modal-box{ background:#fff; border-radius:18px; padding:30px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; }
  .modal-box h3{ margin:0 0 18px; color:var(--navy-deep); }
  .field-inline{ margin-bottom:14px; }
  .field-inline label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:6px; color:var(--navy-deep); }
  .field-inline input, .field-inline textarea, .field-inline select{ width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:14px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-start; margin-top:18px; }
  .btn-sm{ padding:10px 20px; border-radius:99px; font-weight:700; font-size:14px; border:none; }
  .btn-sm.primary{ background:var(--navy); color:#fff; }
  .btn-sm.ghost{ background:var(--bg); color:var(--ink); }

  .toast{ position:fixed; bottom:24px; left:24px; background:var(--navy-deep); color:#fff; padding:14px 22px; border-radius:12px; font-size:14px; font-weight:600; z-index:200; box-shadow:0 10px 24px rgba(0,0,0,.25); display:none; }
  .toast.show{ display:block; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state svg{ width:44px; height:44px; margin-bottom:12px; color:var(--line); }

  .skip-link{ position:absolute; right:-999px; top:0; background:var(--navy); color:#fff; padding:12px 18px; border-radius:0 0 10px 10px; z-index:200; }
  .skip-link:focus{ right:0; }
</style>

async function loadDB(){
  try{
    const res = await window.storage.get('school-site-data', true);
    if(res && res.value){ DB = JSON.parse(res.value); return; }
  }catch(e){ /* not found or storage unavailable */ }
  DB = JSON.parse(JSON.stringify(DEFAULTS));
  DB.ageTable = SAMPLE_AGE_TABLE;
  await saveDB();
}
async function saveDB(){
  try{ await window.storage.set('school-site-data', JSON.stringify(DB), true); }
  catch(e){ console.error('storage save failed', e); }
}

function renderNav(){
  const hash = location.hash || "#/";
  const norm = h => h.split('/').slice(0,2).join('/') || '#/';
  const current = norm(hash);
  document.getElementById('mainNav').innerHTML = NAV_ITEMS.map(i =>
    `<a href="${i.href}" class="${norm(i.href)===current?'active':''}">${i.label}</a>`
  ).join('');
  document.getElementById('mobileMenu').innerHTML =
    NAV_ITEMS.map(i => `<a href="${i.href}" onclick="closeMobileMenu()">${i.label}</a>`).join('') +
    `<a href="#/registration" class="cta-btn" onclick="closeMobileMenu()">التسجيل</a>`;
}
function closeMobileMenu(){ document.getElementById('mobileMenu').classList.remove('open'); }
document.getElementById('menuToggle').addEventListener('click', ()=>{
  document.getElementById('mobileMenu').classList.toggle('open');
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString('ar-SY-u-nu-latn', { year:'numeric', month:'long', day:'numeric' });
}
function fmtDateShort(d){
  const dt = new Date(d+"T00:00:00");
  return { d: dt.toLocaleDateString('ar-SY-u-nu-latn',{day:'numeric'}), m: dt.toLocaleDateString('ar',{month:'short'}) };
}

function populateDobSelectors(){
  const dayEl = document.getElementById('dobDay');
  const monthEl = document.getElementById('dobMonth');
  const yearEl = document.getElementById('dobYear');
  if(!dayEl) return;
  const months = ["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
  dayEl.innerHTML = '<option value="">اليوم</option>' + Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
  monthEl.innerHTML = '<option value="">الشهر</option>' + months.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
  const thisYear = new Date().getFullYear();
  let yearOpts = '<option value="">السنة</option>';
  for(let y = thisYear; y >= thisYear-20; y--){ yearOpts += `<option value="${y}">${y}</option>`; }
  yearEl.innerHTML = yearOpts;
}

function calcGrade(){
  const day = document.getElementById('dobDay').value;
  const month = document.getElementById('dobMonth').value;
  const year = document.getElementById('dobYear').value;
  const box = document.getElementById('calcResult');
  if(!day || !month || !year){
    box.classList.add('show');
    box.innerHTML = `<p style="margin:0; font-weight:600;">يرجى إدخال اليوم والشهر والسنة كاملة لتحديد الصف الدراسي.</p>`;
    return;
  }
  const dob = new Date(Date.UTC(Number(year), Number(month)-1, Number(day)));
  const dobStr = dob.toISOString().slice(0,10);
  const match = DB.ageTable.find(r => dobStr >= r.start && dobStr <= r.end);
  const dobDisplay = fmtDate(dobStr);
  if(match){
    box.innerHTML = `
      <div style="font-size:13.5px; color:rgba(255,255,255,.75); margin-bottom:6px;">بناءً على تاريخ ميلاد الطالب</div>
      <div class="grade-name">${match.grade}</div>
      <div class="dob-echo">تاريخ الميلاد المدخل: ${dobDisplay}</div>
      <div class="disclaimer">هذه النتيجة استرشادية وتعتمد على جدول الأعمار الدراسي للعام 2026 / 2027.</div>`;
  } else {
    box.innerHTML = `
      <div style="font-size:13.5px; color:rgba(255,255,255,.75); margin-bottom:6px;">بناءً على تاريخ ميلاد الطالب: ${dobDisplay}</div>
      <div style="font-size:18px; font-weight:700; color:#fff;">لا يمكن تحديد الصف الدراسي المناسب بناءً على البيانات المدخلة.</div>
      <div class="disclaimer">هذه النتيجة استرشادية وتعتمد على جدول الأعمار الدراسي للعام 2026 / 2027.</div>`;
  }
  box.classList.add('show');
}

function bindContactForm(){
  const form = document.getElementById('contactForm');
  if(!form) return;
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    let valid = true;
    const checks = {
      name: v=>v.trim().length>1,
      phone: v=>/^[0-9+\s-]{7,}$/.test(v.trim()),
      email: v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()),
      subject: v=>v.trim().length>1,
      message: v=>v.trim().length>4
    };
    Object.keys(checks).forEach(key=>{
      const field = document.getElementById('f-'+key);
      const ok = checks[key](data[key]||"");
      field.classList.toggle('invalid', !ok);
      if(!ok) valid = false;
    });
    if(!valid) return;
    DB.messages.unshift({ id: Date.now(), ...data, date: new Date().toISOString(), read:false });
    await saveDB();
    form.reset();
    document.getElementById('formSuccess').classList.add('show');
    setTimeout(()=>document.getElementById('formSuccess').classList.remove('show'), 4000);
  });
}

async function setAdminView(v){ adminView=v; render(); }
function adminLogin(){
  const val = document.getElementById('adminPass').value;
  if(val === 'admin123'){
    adminAuthed = true; sessionStorage.setItem('admin-authed','1'); render(); toast('تم تسجيل الدخول بنجاح');
  } else { toast('كلمة المرور غير صحيحة'); }
}
function adminLogout(){ adminAuthed=false; sessionStorage.removeItem('admin-authed'); render(); }

async function saveContent(){
  DB.content.heroIntro = document.getElementById('c-heroIntro').value;
  DB.content.vision = document.getElementById('c-vision').value;
  DB.content.mission = document.getElementById('c-mission').value;
  DB.content.phone = document.getElementById('c-phone').value;
  DB.content.location = document.getElementById('c-location').value;
  DB.content.facebook = document.getElementById('c-facebook').value;
  DB.content.instagram = document.getElementById('c-instagram').value;
  DB.content.youtube = document.getElementById('c-youtube').value;
  DB.content.whatsapp = document.getElementById('c-whatsapp').value;
  await saveDB();
  toast('تم حفظ التعديلات');
}

async function markRead(id){ const m=DB.messages.find(x=>x.id===id); if(m){ m.read=true; await saveDB(); render(); } }
async function deleteMessage(id){ DB.messages = DB.messages.filter(x=>x.id!==id); await saveDB(); render(); toast('تم حذف الرسالة'); }
async function deleteNews(id){ DB.news = DB.news.filter(x=>x.id!==id); await saveDB(); render(); toast('تم حذف الخبر'); }
async function deleteEvent(id){ DB.events = DB.events.filter(x=>x.id!==id); await saveDB(); render(); toast('تم حذف الفعالية'); }

function openNewsModal(id){
  const n = id ? DB.news.find(x=>x.id===id) : { title:'', date:new Date().toISOString().slice(0,10), excerpt:'', content:'' };
  showModal(`
    <h3>${id?'تعديل خبر':'إضافة خبر جديد'}</h3>
    <div class="field-inline"><label>العنوان</label><input id="m-title" value="${n.title}"></div>
    <div class="field-inline"><label>التاريخ</label><input type="date" id="m-date" value="${n.date}"></div>
    <div class="field-inline"><label>مقدمة قصيرة</label><textarea id="m-excerpt" rows="2">${n.excerpt}</textarea></div>
    <div class="field-inline"><label>محتوى الخبر الكامل</label><textarea id="m-content" rows="5">${n.content}</textarea></div>
    <div class="modal-actions">
      <button class="btn-sm primary" onclick="saveNews(${id||'null'})">حفظ</button>
      <button class="btn-sm ghost" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
async function saveNews(id){
  const payload = {
    title: document.getElementById('m-title').value,
    date: document.getElementById('m-date').value,
    excerpt: document.getElementById('m-excerpt').value,
    content: document.getElementById('m-content').value
  };
  if(id){ Object.assign(DB.news.find(x=>x.id===id), payload); }
  else { DB.news.unshift({ id: Date.now(), ...payload }); }
  await saveDB(); closeModal(); render(); toast('تم حفظ الخبر');
}

function openEventModal(id){
  const ev = id ? DB.events.find(x=>x.id===id) : { title:'', date:new Date().toISOString().slice(0,10), desc:'' };
  showModal(`
    <h3>${id?'تعديل فعالية':'إضافة فعالية جديدة'}</h3>
    <div class="field-inline"><label>العنوان</label><input id="m-etitle" value="${ev.title}"></div>
    <div class="field-inline"><label>التاريخ</label><input type="date" id="m-edate" value="${ev.date}"></div>
    <div class="field-inline"><label>الوصف</label><textarea id="m-edesc" rows="3">${ev.desc}</textarea></div>
    <div class="modal-actions">
      <button class="btn-sm primary" onclick="saveEvent(${id||'null'})">حفظ</button>
      <button class="btn-sm ghost" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
async function saveEvent(id){
  const payload = {
    title: document.getElementById('m-etitle').value,
    date: document.getElementById('m-edate').value,
    desc: document.getElementById('m-edesc').value
  };
  if(id){ Object.assign(DB.events.find(x=>x.id===id), payload); }
  else { DB.events.unshift({ id: Date.now(), ...payload }); }
  await saveDB(); closeModal(); render(); toast('تم حفظ الفعالية');
}

function showModal(html){
  let overlay = document.getElementById('modalOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.className = 'modal-overlay'; overlay.id='modalOverlay';
    overlay.innerHTML = `<div class="modal-box" id="modalBox"></div>`;
    document.body.appendChild(overlay);
  }
  document.getElementById('modalBox').innerHTML = html;
  overlay.classList.add('show');
}
function closeModal(){ const o=document.getElementById('modalOverlay'); if(o) o.classList.remove('show'); }

/* ============================================================
   MAIN RENDER / ROUTER
   ============================================================ */
function render(){
  renderNav();
  const hash = location.hash || "#/";
  const parts = hash.replace('#','').split('/').filter(Boolean);
  const main = document.getElementById('main');
  let html = '';
  if(parts.length===0){ html = pageHome(); }
  else if(parts[0]==='about'){ html = pageAbout(); }
  else if(parts[0]==='departments'){ html = pageDepartments(); }
  else if(parts[0]==='news' && parts[1]){ html = pageNewsDetail(parts[1]); }
  else if(parts[0]==='news'){ html = pageNews(); }
  else if(parts[0]==='registration'){ html = pageRegistration(); }
  else if(parts[0]==='contact'){ html = pageContact(); }
  else if(parts[0]==='admin'){ html = pageAdmin(); }
  else { html = pageHome(); }
  main.innerHTML = html;
  window.scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'instant':'auto'});
  populateDobSelectors();
  bindContactForm();
  renderFooter();
}

window.addEventListener('hashchange', render);
loadDB().then(render);
</script>
